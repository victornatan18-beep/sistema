<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopifyBridge — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="noise"></div>

  <div class="login-wrap">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span class="brand-name">ShopifyBridge</span>
    </div>

    <div class="login-card" id="loginCard">
      <h1>Bem-vindo de volta</h1>
      <p class="subtitle">Acesse sua plataforma de contingência</p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>

      <div id="loginError" class="error-msg" style="display:none"></div>

      <button class="btn-primary" onclick="handleLogin()">
        <span id="loginBtnText">Entrar</span>
        <span id="loginSpinner" class="spinner" style="display:none"></span>
      </button>

      <p class="switch-link">Não tem conta? <a href="#" onclick="showRegister()">Criar conta grátis</a></p>
    </div>

    <div class="login-card" id="registerCard" style="display:none">
      <h1>Criar conta</h1>
      <p class="subtitle">Comece a usar o ShopifyBridge agora</p>

      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="regName" placeholder="Seu nome" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="seu@email.com" />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" />
      </div>

      <div id="regError" class="error-msg" style="display:none"></div>

      <button class="btn-primary" onclick="handleRegister()">
        <span id="regBtnText">Criar conta</span>
        <span id="regSpinner" class="spinner" style="display:none"></span>
      </button>

      <p class="switch-link">Já tem conta? <a href="#" onclick="showLogin()">Entrar</a></p>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import FIREBASE_CONFIG from './js/firebase-config.js';

    const app = initializeApp(FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window._auth = auth;
    window._db = db;

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'pages/dashboard.html';
    });

    window.handleLogin = async function() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      document.getElementById('loginBtnText').style.display = 'none';
      document.getElementById('loginSpinner').style.display = 'inline-block';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch(e) {
        errEl.textContent = 'Email ou senha inválidos.';
        errEl.style.display = 'block';
        document.getElementById('loginBtnText').style.display = 'inline';
        document.getElementById('loginSpinner').style.display = 'none';
      }
    };

    window.handleRegister = async function() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const errEl = document.getElementById('regError');
      errEl.style.display = 'none';
      document.getElementById('regBtnText').style.display = 'none';
      document.getElementById('regSpinner').style.display = 'inline-block';
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch(e) {
        let msg = 'Erro ao criar conta.';
        if (e.code === 'auth/email-already-in-use') msg = 'Email já cadastrado.';
        if (e.code === 'auth/weak-password') msg = 'Senha muito fraca (mínimo 6 caracteres).';
        errEl.textContent = msg;
        errEl.style.display = 'block';
        document.getElementById('regBtnText').style.display = 'inline';
        document.getElementById('regSpinner').style.display = 'none';
      }
    };
  </script>
  <script>
    function showRegister() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('registerCard').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('registerCard').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
    }
  </script>
</body>
</html>
